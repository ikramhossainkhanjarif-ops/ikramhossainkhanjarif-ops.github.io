<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নিখোঁজ স্টুডেন্ট আইডি উদ্ধার কেন্দ্র 🕵️‍♂️</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 40px 28px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .badge {
      display: inline-block;
      background: #764ba2;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .emoji-header {
      font-size: 50px;
      margin-bottom: 8px;
      display: inline-block;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    h2 {
      color: #1a202c;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #4a5568;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      text-align: center;
      transition: all 0.3s;
      background: #f8fafc;
    }

    input:focus {
      border-color: #764ba2;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(118, 75, 162, 0.35);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(118, 75, 162, 0.45);
    }

    button:active {
      transform: translateY(1px);
    }

    #result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 18px;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .success {
      background-color: #f0fff4;
      border: 2px dashed #38a169;
      color: #276749;
    }

    .error {
      background-color: #fff5f5;
      border: 2px dashed #e53e3e;
      color: #9b2c2c;
    }

    .student-id {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #764ba2;
      margin-top: 8px;
      font-family: monospace;
    }

    .loader {
      display: none;
      margin: 20px auto 0;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #764ba2;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge"> নিখোঁজ স্টুডেন্ট আইডি উদ্ধার কেন্দ্র 🕵️‍♂️</span> <br>
    <div class="emoji-header">🕵️‍♂️</div>
    <h2>তোমার Student ID খুজছো?</h2>
    <p class="subtitle">রেজিস্ট্রেশনে যে মোবাইল নাম্বার দিয়েছ সেটা নিচে টাইপ কর!(ইংলিশ এ 11 ডিজিট,কোন হাইফেন ছাড়া)🫤</p>

    <form id="searchForm">
      <div class="input-group">
        <input type="tel" id="phoneInput" placeholder="017XXXXXXXX" required autocomplete="off">
      </div>
      <button type="submit">আইডি বের করো 🚀</button>
    </form>

    <div class="loader" id="loader"></div>
    <div id="result"></div>
  </div>
  <script>
    
    const API_URL = "https://script.google.com/macros/s/AKfycbz-RDGntWVMPk08Ihgh-W51SoYKXRJmoVhDMFLct8HreKZV3qZOP7gU-gMlMIW2p15kpw/exec";

    document.getElementById('searchForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const phone = document.getElementById('phoneInput').value.trim();
      const loader = document.getElementById('loader');
      const resultDiv = document.getElementById('result');

      if (!phone) return;

      resultDiv.style.display = 'none';
      resultDiv.className = '';
      loader.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}?phone=${encodeURIComponent(phone)}`);
        const data = await response.json();

        loader.style.display = 'none';
        resultDiv.style.display = 'block';

        if (data.success) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `
            <p>🎉 অভিনন্দন! তোমার আইডি পাওয়া গেছে :</p>
            <div class="student-id">${data.studentId}</div>
            <p style="font-size: 12px; margin-top: 5px; opacity: 0.8;">(স্ক্রিনশট নিয়ে রাখো, 🥱! )</p>
          `;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `<p>${data.message}</p>`;
        }
      } catch (error) {
        loader.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.className = 'error';
        resultDiv.innerHTML = '<p>সার্ভার একটু ঝিমাচ্ছে! ২ সেকেন্ড পর আবার ট্রাই কর। 😅</p>';
      }
    });
  </script>
</body>
</html>
